<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blinking Exclamation</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .mark {
        font-size: clamp(8rem, 25vw, 20rem);
        font-weight: 900;
        line-height: 1;
        color: #000;
        animation: blink 0.9s steps(1, end) infinite;
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-label="blinking exclamation mark">!</div>
  </body>
</html>
